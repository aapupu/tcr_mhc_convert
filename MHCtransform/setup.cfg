[metadata]
name = mhctransform
version = 0.3.0
description = Auditable human/mouse MHC exact, partial and imputed AF3/pseudosequence conversion
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/aapupu/tcr_mhc_convert/tree/main/MHCtransform
license = MIT
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
include_package_data = True
python_requires = >=3.9

[options.packages.find]
where = src

[options.package_data]
mhctransform =
    data/*.csv
    data/*.json

[options.entry_points]
console_scripts =
    mhctransform = mhctransform.cli:main

