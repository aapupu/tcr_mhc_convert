[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhctransform"
version = "0.2.0"
description = "Auditable human/mouse MHC full, AF3 extracellular-chain and 34-aa pseudosequence lookup"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "tcr_mhc_convert contributors"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/aapupu/tcr_mhc_convert"
Repository = "https://github.com/aapupu/tcr_mhc_convert"
Documentation = "https://github.com/aapupu/tcr_mhc_convert/tree/main/MHCtransform"

[project.scripts]
mhctransform = "mhctransform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mhctransform = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

