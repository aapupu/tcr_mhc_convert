[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhctransform"
version = "0.6.0"
description = "Auditable human/mouse MHC full, PBR, AF3 and 34-aa conversion"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [{name = "tcr_mhc_convert contributors"}]
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/aapupu/tcr_mhc_convert"
Repository = "https://github.com/aapupu/tcr_mhc_convert"
Documentation = "https://github.com/aapupu/tcr_mhc_convert/tree/main/MHCtransform"

[project.scripts]
mhctransform = "mhctransform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mhctransform = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

