[metadata]
name = tcrtransform
version = 0.2.0
description = Human and mouse TCR sequence reconstruction and CDR region annotation
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/aapupu/tcr_mhc_convert/tree/main/TCRtransform
license = MIT
license_files =
    LICENSE
    NOTICE.md

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
tcrtransform =
    data/*.csv
    data/*.json
    data/*.md
    data/*.tsv

[options.entry_points]
console_scripts =
    tcrtransform = tcrtransform.cli:main

